name: Web E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      
      - name: clone do projeto para a máquina
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalando dependências
        run: npm ci

      - name: Executando os testes
        run: npx cypress run --spec "cypress/e2e/1-getting-started/automation-exercise-trabalho-final.cy.js"

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore